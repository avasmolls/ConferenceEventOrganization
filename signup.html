<!-- 2. A user-sign-up page
    - Optionally, you can include a field for a phone number
    - This must be a separate page from your homepage
    - Styled with CSS and Bootstrap
    - Contains the following required fields for user input: name, age, email address, and address
    - Uses JavaScript to validate user inputs
    - Uses JSON to store the information a user inputs on this page-->

<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Attendee Management</title>

        <!-- Bootstrap -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"
            integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
        <!-- todo: Add custom styles here -->
        <style> 
                
        </style>
    </head>
    
    <body>

        <form>
            <div>
                <label for="tbEmail">Email:</label>
                <input type="text" id="tbEmail"/>
            </div>
            <div>
                <label for="tbName">First and Last Name:</label>
                <input type="text" id="tbName"/>
            </div>
            <div>
                <label for="tbAge">Age:</label>
                <input type="text" id="tbAge"/>
            </div>
            <div>
                <label for="tbCompany">Company Name:</label>
                <input type="text" id="tbCompany"/>
            </div>
            <button id="btnSubmit" type="button" value="Create Account" onclick="validateData()">Create Account</button>
        </form>

        <script type="text/javascript">
            function validateData() {
            console.log("Validating")
            let age = document.getElementById("tbAge");
            let name = document.getElementById("tbName");
            let email = document.getElementById("tbEmail");
            let company = document.getElementById("tbCompany");
            let ageVal = age.value;
            let emailVal = email.value;
            let nameVal = name.value;
            let companyVal = company.value;
            let rexAge = /\d{1,3}/;
            let rexEmail = /@\w+\.com$/;
            let rexName = /^[a-zA-Z]+\s[a-zA-Z]+$/;
            let rexCompany = /\w+/;
            let isDig = rexAge.test(ageVal);
            let isEmail = rexEmail.test(emailVal);
            let isName = rexName.test(nameVal);
            let isCompany = rexCompany.test(companyVal);
            if (!isDig){
                alert("Not a number or null");
                return console.log(false);
            } 

            if (!isEmail){
                alert("Invalid email format");
                return console.log(false);
            } 
            
            if (!isName){
                alert("Invalid name format");
                return console.log(false);
            } 

            if (!isCompany){
                alert("Invalid company name");
                return console.log(false);
            } 

            return console.log(true);

            }
        </script>
    </body>

</html>
