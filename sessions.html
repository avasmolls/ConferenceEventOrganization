<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conference Sessions</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">

  <!-- Importing Inter font from Google Fonts -->

  <!-- Shared custom styles -->
  <link href="css/styles.css" rel="stylesheet">
</head>

<body>
  <!-- Navigation -->
  <nav class="navbar navbar-expand py-3">
    <div class="container">
      <a class="navbar-brand site-title" href="index.html">Attendee Management</a>

      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link active" href="index.html">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="signup.html">Sign Up</a>
        </li>
        <li class="nav-item active">
          <a class="nav-link" href="sessions.html">Product Details</a>
      </ul>
    </div>
  </nav>


  <h1>Conference Sessions</h1>
  <p>Add and manage conference sessions.</p>

    <!-- Adding New Sessions -->
  <main class="container my-5">
    <div class="row mb-4">
      <div class="col-12">
        <h1 class="fw-bold text-uppercase">Conference Sessions</h1>
      </div>
    </div>

    <div class="row g-4">
      <!-- Add/Update Form -->
      <div class="col-lg-5">
        <div class=""card shadow-sm border-0 rounded-4 p-4 bg-white>
          <h2 class="h4 fw-bold mb-4">Add Session</h2>
        </div>
      </div>
      <form id="sessionForm" onsubmit="return validateForm()">
        <form id="sessionForm" onsubmit="return validateForm()">
            <div class="mb-3">
              <label for="sessionId" class="form-label fw-semibold">Session ID:</label>
              <input type="text" class="form-control" id="sessionId" required>
            </div>

            <div class="mb-3">
              <label for="sessionTitle" class="form-label fw-semibold">Session Title:</label>
              <input type="text" class="form-control" id="sessionTitle" required>
            </div>

            <div class="mb-3">
              <label for="category" class="form-label fw-semibold">Category:</label>
              <select class="form-select" id="category" required>
                <option value="" selected disabled>Choose a category</option>
                <option value="Technology">Technology</option>
                <option value="Workshop">Workshop</option>
                <option value="Keynote">Keynote</option>
              </select>
            </div>

            <div class="mb-3">
              <label for="format" class="form-label fw-semibold">Format:</label>
              <input type="text" class="form-control" id="format" required>
            </div>

            <div class="mb-3">
              <label for="price" class="form-label fw-semibold">Ticket Price:</label>
              <div class="input-group">
                <span class="input-group-text">$</span>
                <input type="text" class="form-control" id="price" required>
              </div>
            </div>

            <div class="mb-3">
              <label for="speaker" class="form-label fw-semibold">Speaker:</label>
              <input type="text" class="form-control" id="speaker">
            </div>

            <!-- Buttons use .btn-primary which is styled orange in styles.css -->
            <div class="d-grid gap-2">
              <button type="submit" class="btn btn-primary fw-semibold py-2">Add Session</button>
              <button type="button" id="updateBtn" class="btn btn-outline-secondary fw-semibold py-2">Update Session</button>
            </div>
          </form>
        </div>
      </div>
<!-- Displaying Existing Sessions -->
 <div class="col-lg-7">
  <div class="card shadow-sm border-0 rounded-4 p-4 bg-white">
    <h2 class="h4 fw-bold mb-3 text-dark">Existing Sessions</h2>

    <div class="mb-3">
      <input type="text" id=""search" class="form-control" placeholder="Search sessions">
    </div>

    <div class="table-responsive">
      <table class="table table-striped table-hover align-middle">
        <thead>
          <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Category</th>
            <th>Format</th>
            <th>Price</th>
            <th>Speaker</th>
          </tr>
        </thead>
        <tbody id="sessionTable">
        </tbody>
        </table>
    </div>
  </div>
 </div>
</main>
        <script type="text/javascript">
            function validateForm() {
                //Item ID or Identifier (required) ID number
                // Item Description or Title (required) Title + Description 255 Char
                // Item Category or Type (required) Dropdown
                // Unit of Measure or Format (required) Capacity
                // Item Price or Value (required) Ticket Price
                // Date
              let id = document.getElementById("sessionId").value;
              let title = document.getElementById("sessionTitle").value;
              let price = document.getElementById("price").value;
              let idVal = id.value;
              let titleVal = title.value;
              let priceVal = price.value;
              let rexDig = /^[0-9]+$/;
              let rexTitle = /^[a-zA-Z0-9\s]+$/;
              let rexPrice = /^[0-9]+(\.[0-9]{1,2})?$/;
              let isID = rexDig.test(idVal);
              let isTitle = rexTitle.test(titleVal);
              let isPrice = rexPrice.test(priceVal);
              
              if (!isID) {
                alert("Session ID must be a number.");
              }

              if (!isTitle) {
                alert("Session Title must be alphanumeric.");
              }

              if (!isPrice) {
                alert("Ticket Price must be a valid number.");
              }

              let sessions = [
                { id:123, title: "Example: A Sample Workshop", category: "Workshop", format:"Hands-On", price: "67.99", speaker: "John Doe".}
              ]

              function renderSessions(dataArray) {
                let container = $("#SessionTicketContainer");
                container.empty();

                if (dataArray.length === 0) {
                  container.html('<div class="col-12 text-center text-muted py-4">No session found</div>');
                  return;
                }

                dataArray.foreEach(session => {
                  let ticketCard = `
                  <div class="col-md-6 mb-4">
                    <div class="card bord-0 shadow-sm overflow-hidden h-100 ticket-card">
                      <div class="row g-0 h-100">
                        <!-- Left Ticket Stub (Price & Category) -->
                        <div class="col-4 bg-primary text-white d-flex flex-column justify-content-center align-items-center p-3 text-center ticket-stub">
                          <span class="badge bg-light text-dark mb-2 text-truncate w-100">${session.category}</span>
                          <h3 class="fw-bold mb-0 text-white">$${session.price}</h3>
                          <small class="text-white-50 text-uppercase">${session.format}</small>
                        </div>
                        <!-- Right Ticket Details (Title, ID, Speaker) -->
                        <div class="col-8 bg-white p-3 d-flex flex-column justify-content-between">
                          <div>
                            <div class="d-flex justify-content-between align-items-start mb-1">
                              <h5 class="card-title fw-bold text-dark fs-6 text-truncate">${session.title}</h5>
                            </div>
                            <p class="text-muted small mb-1"><strong>Speaker:</strong> ${session.speaker || 'TBD'}</p>
                            <span class="badge bg-secondary bg-opacity-15 text-secondary border">ID: #${session.id}</span>
                          </div>
                          
                          <div class="d-flex justify-content-end gap-2 mt-3">
                            <button class="btn btn-sm btn-outline-primary edit-session-btn" data-id="${session.id}">Edit</button>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                `;
                container.append(ticketCard);
                });
              }
              $(document).ready(function() {
                renderSessions(sessions);
              });
            }
        </script>
    </body>
</body>
</body>

</html>
