<!--
                Objectives
Build a structured and responsive HTML form for creating and updating entries
Apply CSS and Bootstrap to enhance layout and visual design
Use JavaScript for form validation and interactive page behavior
Create and manage a JSON document to store content or product details
Use jQuery to search, filter, and update JSON entries dynamically
--------------------------------------------------------
                Required Fields
Item ID or Identifier (required)
Item Description or Title (required)
Item Category or Type (required)
Unit of Measure or Format (required)
Item Price or Value (required)
Item Weight or Additional Info (optional)
-->

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conference Sessions</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">

  <!-- Importing Inter font from Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Shared custom styles -->
  <link href="css/styles.css" rel="stylesheet">
</head>

<body>
  <!-- Navigation -->
  <nav class="navbar navbar-expand py-3">
    <div class="container">
      <a class="navbar-brand site-title" href="index.html">Attendee Management</a>

      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link active" href="index.html">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="signup.html">Sign Up</a>
        </li>
        <li class="nav-item active">
          <a class="nav-link" href="sessions.html">Sessions</a>
        </li>
        <li class="nav-item">   
          <a class="nav-link" href="cart.html">Cart</a>
        </li>
      </ul>
    </div>
  </nav>

  <!-- Adding New Sessions -->
  <main class="container my-5">
    <div class="row mb-4">
      <div class="col-12">
        <h1 class="fw-bold text-uppercase">Conference Sessions</h1>
      </div>
    </div>

    <div class="row g-4">
      <!-- Add/Update Form -->
      <div class="col-lg-5">
        <div class="card shadow-sm border-0 rounded-4 p-4 bg-white">
          <h2 class="h4 fw-bold mb-4">Add Session</h2>
          <form id="sessionForm" onsubmit="return validateForm()">
            <div class="mb-3">
              <label for="sessionId" class="form-label fw-semibold">Session ID:</label>
              <input type="text" class="form-control" id="sessionId" required>
            </div>

            <div class="mb-3">
              <label for="sessionTitle" class="form-label fw-semibold">Session Title:</label>
              <input type="text" class="form-control" id="sessionTitle" required>
            </div>

            <div class="mb-3">
              <label for="category" class="form-label fw-semibold">Category:</label>
              <select class="form-select" id="category" required>
                <option value="" selected disabled>Choose a category</option>
                <option value="Technology">Technology</option>
                <option value="Workshop">Workshop</option>
                <option value="Keynote">Keynote</option>
              </select>
            </div>

            <div class="mb-3">
              <label for="format" class="form-label fw-semibold">Format:</label>
              <input type="text" class="form-control" id="format" required>
            </div>

            <div class="mb-3">
              <label for="price" class="form-label fw-semibold">Ticket Price:</label>
              <div class="input-group">
                <span class="input-group-text">$</span>
                <input type="text" class="form-control" id="price" required>
              </div>
            </div>

            <div class="mb-3">
              <label for="speaker" class="form-label fw-semibold">Speaker:</label>
              <input type="text" class="form-control" id="speaker">
            </div>

            <!-- Buttons use .btn-primary which is styled orange in styles.css -->
            <div class="d-grid gap-2">
              <button type="submit" class="btn btn-primary fw-semibold py-2">Add Session</button>
              <button type="button" id="updateBtn" class="btn btn-outline-secondary fw-semibold py-2">Update
                Session</button>
            </div>
          </form>
        </div>
      </div>
      <!-- Displaying Existing Sessions -->
      <div class="col-lg-7">
        <div class="card shadow-sm border-0 rounded-4 p-4 bg-white">
          <h2 class="h4 fw-bold mb-3 text-dark">Existing Sessions</h2>

          <div class="mb-3">
            <input type="text" id="search" class="form-control" placeholder="Search sessions">
          </div>

          <div id="sessionTable" class="row"></div>
        </div>
      </div>
    </div>
  </main>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script type="text/javascript">
    let sessions = []

    // One shared validation funcion used by add and update - needed to change for jQuery to work properly 
    function getErrors() {
      //Item ID or Identifier (required) ID number
      // Item Description or Title (required) Title
      // Item Category or Type (required) Dropdown
      // Unit of Measure or Format (required) Format
      // Item Price or Value (required) Ticket Price
      // Speaker
      let id = $("#sessionId").val().trim();
      let title = $("#sessionTitle").val().trim();
      let price = $("#price").val().trim();
      let format = $("#format").val().trim();
      let speaker = $("#speaker").val().trim();
      let category = ($("#category").val() || "").trim();

      let rexDig = /^[0-9]+$/;
      let rexAlphaNum = /^[a-zA-Z0-9\s]+$/;
      let rexPrice = /^[0-9]+(\.[0-9]{1,2})?$/;
      let rexName = /^[A-Za-z]+(?:[ '-][A-Za-z]+)*$/;

      let errors = [];
      if (!rexDig.test(id)) errors.push("Session ID must be a number.");
      if (!rexAlphaNum.test(title)) errors.push("Session Title must be alphanumeric.");
      if (!rexPrice.test(price)) errors.push("Ticket Price must be a valid number.");
      if (!rexAlphaNum.test(format)) errors.push("Format must be alphanumeric.");
      if (speaker && !rexName.test(speaker)) errors.push("Speaker name must be a valid name.");
      if (!category) errors.push("Please choose a category.");

      return errors;
    }

    function readForm() {
      return {
        id: Number($("#sessionId").val().trim()),
        title: $("#sessionTitle").val().trim(),
        category: $("#category").val(),
        format: $("#format").val().trim(),
        price: $("#price").val().trim(),
        speaker: $("#speaker").val().trim()
      };
    }

    function resetForm() {
      $("#sessionForm")[0].reset();
      $("#sessionId").prop("readonly", false);
    }

    // Add function
    function validateForm() {
      let errors = getErrors();
      // moved this into add function that way getErrors() can be used for both addding and updating
      if (errors.length > 0) {
        alert(errors.join("\n"));
        return false; // Prevent form submission
      }

      let entry = readForm();
      if (sessions.some(s => s.id === entry.id)) {
        alert("A session with that ID already exists. Use Edit, then Update Session.");
        return false;
      }

      sessions.push(entry);
      renderSessions(sessions);
      resetForm();
      return false; // stay on the page

    }

    function renderSessions(dataArray) {
      let container = $("#sessionTable").empty();

      if (dataArray.length === 0) {
        container.html('<div class="col-12 text-center text-muted py-4">No session found</div>');
        return;
      }

      dataArray.forEach(session => {
        let ticketCard = `
              <div class="col-md-6 mb-4">
                <div class="card border-0 shadow-sm overflow-hidden h-100 ticket-card">
                  <div class="row g-0 h-100">
                    <!-- Left Ticket Stub (Price & Category) -->
                    <div class="col-4 bg-primary text-white d-flex flex-column justify-content-center align-items-center p-3 text-center ticket-stub">
                      <span class="badge bg-light text-dark mb-2 text-truncate w-100">${session.category}</span>
                      <h3 class="fw-bold mb-0 text-white">$${session.price}</h3>
                      <small class="text-white-50 text-uppercase">${session.format}</small>
                    </div>
                    <!-- Right Ticket Details (Title, ID, Speaker) -->
                    <div class="col-8 bg-white p-3 d-flex flex-column justify-content-between">
                      <div>
                        <div class="d-flex justify-content-between align-items-start mb-1">
                          <h5 class="card-title fw-bold text-dark fs-6 text-truncate">${session.title}</h5>
                        </div>
                        <p class="text-muted small mb-1"><strong>Speaker:</strong> ${session.speaker || 'TBD'}</p>
                        <span class="badge bg-secondary bg-opacity-15 text-secondary border">ID: #${session.id}</span>
                      </div>
                      
                      <div class="d-flex justify-content-end gap-2 mt-3">
                        <button class="btn btn-sm btn-outline-primary edit-session-btn" data-id="${session.id}">Edit</button>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            `;
        container.append(ticketCard);
      });
    }
    $(document).ready(function () {
      // loading json from separate file (in order for this to work run code in a live version/local server not file://)
      $.getJSON("sessions.json")
        .done(function (data) {
          sessions = data;
          renderSessions(sessions);
        })
        .fail(function () {
          $("#sessionTable").html('<div class="col-12 text-danger">Could not load sessions.json</div>');
        });
      // Search/Filter
      $("#search").on("input", function () {
        const term = $(this).val().toLowerCase().trim();
        const filtered = sessions.filter(s =>
          Object.values(s).some(v => String(v).toLowerCase().includes(term))
        );
        renderSessions(filtered);
      });
      // Populate form when click edit
      $("#sessionTable").on("click", ".edit-session-btn", function () {
        const s = sessions.find(x => x.id === Number($(this).data("id")));
        if (!s) return;
        $("#sessionId").val(s.id).prop("readonly", true); // ID shouldn't change during edit
        $("#sessionTitle").val(s.title);
        $("#category").val(s.category);
        $("#format").val(s.format);
        $("#price").val(s.price);
        $("#speaker").val(s.speaker);
      });
      // Update
      $("#updateBtn").on("click", function () {
        const s = sessions.find(x => x.id === Number($("#sessionId").val()));
        if (!s) return alert("Click Edit on a session first.");

        let errors = getErrors();
        if (errors.length > 0) {
          return alert(errors.join("\n"));
        }

        Object.assign(s, readForm());
        renderSessions(sessions);
        resetForm();
      });
    });
  </script>
</body>

</html>
